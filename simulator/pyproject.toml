[project]
name = "simulator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "azure-cosmos>=4.9,<5",
    "azure-identity>=1.20,<2",
    "azure-servicebus>=7.13,<8",
    "azure-storage-blob>=12.24,<13",
    "pydantic>=2,<3",
    "typing-extensions>=4.0",
]

[project.scripts]
simulate_pipeline = "simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.hatch.build]
sources = ["src"]

[tool.uv]
package = true
