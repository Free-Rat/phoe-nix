[project]
name = "log_router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.21,<2",
    "azure-servicebus>=7.13,<8",
    "pydantic>=2,<3",
    "schemas",
]

[project.scripts]
log_router = "log_router.main:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_router"]

[tool.hatch.build]
sources = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
schemas = { path = "../schemas" }
