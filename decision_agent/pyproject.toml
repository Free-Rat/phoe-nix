[project]
name = "decision_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-cosmos>=4.9,<5",
    "azure-functions>=1.21,<2",
    "azure-identity>=1.20,<2",
    "azure-servicebus>=7.13,<8",
    "pydantic>=2,<3",
    "schemas",
]

[project.scripts]
decision_agent = "decision_agent.main:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_agent"]

[tool.hatch.build]
sources = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
schemas = { path = "../schemas" }
