[project]
name = "local_agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "azure-cosmos>=4.9,<5",
    "azure-identity>=1.20,<2",
    "azure-servicebus>=7.13,<8",
    "pydantic>=2,<3",
    "schemas",
]

[project.scripts]
local_agent = "local_agent.main:run_cli"
local_agent_manual_integration = "local_agent.manual_integration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agent"]

[tool.hatch.build]
sources = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
schemas = { path = "../schemas" }
