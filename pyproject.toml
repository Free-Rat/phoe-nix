[tool.ruff]
line-length = 120
target-version = "py311"
src = [
  "analysis_agent/src",
  "decision_agent/src",
  "local_agent/src",
  "log_service/src",
  "log_router/src",
  "simulator/src",
  "schemas/src",
  "token_service/src",
]
extend-exclude = [
  "log_service/.venv",
  "infrastructure/.terraform",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
