[project]
name = "analysis_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.21,<2",
    "azure-identity>=1.20,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "azure-servicebus>=7.13,<8",
    "pydantic>=2,<3",
    "schemas",
]

[project.scripts]
analysis_agent = "analysis_agent.main:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_agent"]

[tool.hatch.build]
sources = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
schemas = { path = "../schemas" }
